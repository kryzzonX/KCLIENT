name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mod-yarn:
    name: mod ${{ matrix.mc }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "1.21.2", gfx: "3d", entry: "old", loom: "1.11-SNAPSHOT", gradle: "8.14.3" }
          - { mc: "1.21.3", gfx: "3d", entry: "old", loom: "1.11-SNAPSHOT", gradle: "8.14.3" }
          - { mc: "1.21.4", gfx: "3d", entry: "old", loom: "1.11-SNAPSHOT", gradle: "8.14.3" }
          - { mc: "1.21.5", gfx: "3d", entry: "old", loom: "1.11-SNAPSHOT", gradle: "8.14.3" }
          - { mc: "1.21.6", gfx: "2d", entry: "old", loom: "1.11-SNAPSHOT", gradle: "8.14.3" }
          - { mc: "1.21.7", gfx: "2d", entry: "old", loom: "1.11-SNAPSHOT", gradle: "8.14.3" }
          - { mc: "1.21.8", gfx: "2d", entry: "old", loom: "1.11-SNAPSHOT", gradle: "8.14.3" }
          - { mc: "1.21.11", gfx: "2d", entry: "new", loom: "1.14-SNAPSHOT", gradle: "9.6.0" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Resolve mappings and Fabric API
        id: v
        run: |
          YARN=$(curl -fsS "https://meta.fabricmc.net/v2/versions/yarn/${{ matrix.mc }}" | jq -r '.[0].version')
          FAPI=$(curl -fsS https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o "<version>[^<]*+${{ matrix.mc }}</version>" | sed 's/<[^>]*>//g' | sort -V | tail -1)
          test -n "$YARN" && test -n "$FAPI"
          echo "yarn=$YARN" >> "$GITHUB_OUTPUT"
          echo "fapi=$FAPI" >> "$GITHUB_OUTPUT"
          echo "Yarn $YARN, Fabric API $FAPI"
      - name: Build
        working-directory: "Uusi kansio/mod/yarn"
        run: >
          gradle build --no-daemon
          -Pminecraft_version=${{ matrix.mc }}
          -Pyarn_mappings=${{ steps.v.outputs.yarn }}
          -Pfabric_version=${{ steps.v.outputs.fapi }}
          -Pjava_release=21
          -Ploom_version=${{ matrix.loom }}
          -Pgfx_variant=${{ matrix.gfx }}
          -Pentry_variant=${{ matrix.entry }}
          -Pmc_range=${{ matrix.mc }}
          -Parchives_base_name=k-client-${{ matrix.mc }}
      - uses: actions/upload-artifact@v4
        with:
          name: k-client-mod-${{ matrix.mc }}
          path: "Uusi kansio/mod/yarn/build/libs/*.jar"

  mod-26:
    name: mod ${{ matrix.mc }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        mc: ["26.1", "26.2", "26.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0
      - name: Resolve Fabric API
        id: v
        run: |
          FAPI=$(curl -fsS https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o "<version>[^<]*+${{ matrix.mc }}</version>" | sed 's/<[^>]*>//g' | sort -V | tail -1)
          test -n "$FAPI"
          echo "fapi=$FAPI" >> "$GITHUB_OUTPUT"
          echo "Fabric API $FAPI"
      - name: Build
        working-directory: "Uusi kansio/mod/v26"
        run: >
          gradle build --no-daemon
          -Pminecraft_version=${{ matrix.mc }}
          -Pfabric_version=${{ steps.v.outputs.fapi }}
          -Pmc_range=~${{ matrix.mc }}
          -Parchives_base_name=k-client-${{ matrix.mc }}
      - uses: actions/upload-artifact@v4
        with:
          name: k-client-mod-${{ matrix.mc }}
          path: "Uusi kansio/mod/v26/build/libs/*.jar"

  app:
    needs: [mod-yarn, mod-26]
    if: ${{ always() }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: "Uusi kansio"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: k-client-mod-*
          merge-multiple: true
          path: "Uusi kansio/mod-jar"
      - run: New-Item -ItemType Directory -Force -Path mod-jar | Out-Null
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: K-Client-Launcher-Setup
          path: "Uusi kansio/dist/*.exe"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: "Uusi kansio/dist/*.exe"
