name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mod-1214:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - run: gradle build --no-daemon
        working-directory: "Uusi kansio/mod/v1214"
      - uses: actions/upload-artifact@v4
        with:
          name: k-client-mod-1214
          path: "Uusi kansio/mod/v1214/build/libs/*.jar"

  mod-263:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0
      - run: gradle build --no-daemon
        working-directory: "Uusi kansio/mod/v263"
      - uses: actions/upload-artifact@v4
        with:
          name: k-client-mod-263
          path: "Uusi kansio/mod/v263/build/libs/*.jar"

  app:
    needs: [mod-1214, mod-263]
    if: ${{ always() }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: "Uusi kansio"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: k-client-mod-*
          merge-multiple: true
          path: "Uusi kansio/mod-jar"
      - run: New-Item -ItemType Directory -Force -Path mod-jar | Out-Null
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: K-Client-Launcher-Setup
          path: "Uusi kansio/dist/*.exe"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: "Uusi kansio/dist/*.exe"
